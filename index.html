<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confecciones Salomé - Catálogo Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Si notas que el rosado del logo es ligeramente distinto, puedes cambiar este código hex #b0005a por el exacto */
        .bg-fucsia { background-color: #b0005a; }
        .text-fucsia { color: #b0005a; }
        #carrito-panel { transition: transform 0.3s ease-in-out; }
        .translate-x-full { transform: translateX(100%); }
        .scroll-variantes::-webkit-scrollbar { width: 4px; }
        .scroll-variantes::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar Corporativo -->
    <header class="bg-fucsia shadow-md p-3 flex justify-between items-center sticky top-0 z-40">
        <!-- Espaciador invisible para centrar el logo perfectamente -->
        <div class="w-12"></div>
        
        <!-- Logo Central -->
        <div class="cursor-pointer flex justify-center items-center" onclick="cerrarDetalle()">
            <img src="logo.png" alt="Confecciones Salomé" class="h-11 w-auto object-contain rounded shadow-sm border border-pink-700">
        </div>
        
        <!-- Botón del Carrito (En blanco para contrastar con el fondo fucsia) -->
        <button onclick="toggleCarrito()" class="relative p-2 hover:bg-pink-800 rounded-full transition text-white w-12 flex justify-center items-center">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            <span id="contador-carrito" class="absolute top-0 right-0 bg-white text-fucsia text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold shadow">0</span>
        </button>
    </header>

    <!-- Buscador -->
    <div class="bg-white px-4 py-3 border-b sticky top-[68px] z-30 shadow-sm">
        <div class="max-w-7xl mx-auto relative">
            <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="buscador" onkeyup="filtrarCatalogo()" placeholder="Buscar prenda (ej. Body, Top...)" class="w-full bg-gray-100 border-transparent rounded-lg pl-10 pr-4 py-2 focus:bg-white focus:border-pink-500 focus:ring-2 focus:ring-pink-200 outline-none transition">
        </div>
    </div>

    <!-- Contenedor Principal -->
    <main class="p-4 max-w-7xl mx-auto flex flex-col md:flex-row gap-6 items-start relative">
        
        <!-- PANEL IZQUIERDO: Detalles del Producto -->
        <section id="panel-detalle" class="fixed inset-0 z-50 bg-white p-5 overflow-y-auto transform translate-y-full transition-transform duration-300 md:relative md:transform-none md:z-auto md:w-2/5 md:rounded-xl md:shadow-lg md:sticky md:top-36 md:flex flex-col hidden">
            
            <button type="button" onclick="cerrarDetalle()" class="md:hidden absolute top-4 right-4 bg-white text-gray-900 rounded-full p-2.5 z-[60] shadow-2xl border border-gray-200 active:scale-95 cursor-pointer flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <!-- Sección central vacía con el logo de marca de agua -->
            <div id="contenido-detalle" class="mt-8 md:mt-0 h-full flex flex-col justify-center">
                <div class="text-center text-gray-400 py-20 hidden md:flex flex-col items-center">
                    <img src="logo.png" class="h-24 mb-5 opacity-40 rounded-xl grayscale transition hover:grayscale-0 duration-300">
                    <p class="font-medium">Selecciona un producto del catálogo.</p>
                </div>
            </div>
        </section>

        <!-- PANEL DERECHO: Catálogo -->
        <section class="w-full md:w-3/5">
            <div id="grid-productos" class="grid grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="sin-resultados" class="hidden text-center text-gray-500 py-10">
                No se encontraron prendas con ese nombre.
            </div>
        </section>

    </main>

    <!-- Panel Lateral del Carrito -->
    <div id="carrito-panel" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl transform translate-x-full z-50 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-lg font-bold">TU CARRITO</h2>
            <button onclick="toggleCarrito()" class="text-gray-500 hover:text-gray-800 font-bold text-2xl">&times;</button>
        </div>
        
        <div id="lista-carrito" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <div class="p-4 border-t bg-gray-50">
            <div class="text-lg font-bold mb-4 flex justify-between">
                <span>Total:</span>
                <span class="text-fucsia">$<span id="total-precio">0.00</span></span>
            </div>
            <button onclick="enviarWhatsApp()" class="w-full bg-fucsia text-white font-bold py-3 rounded-lg shadow-lg hover:bg-pink-800 transition">
                CONFIRMAR PEDIDO
            </button>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let productosBase = [];
        let carrito = [];
        let productoActivo = null;
        let imgIndexActual = 0;

        function renderizarCatalogo(listaA_Mostrar = productosBase) {
            const grid = document.getElementById('grid-productos');
            const msgVacio = document.getElementById('sin-resultados');
            grid.innerHTML = '';

            if(listaA_Mostrar.length === 0) {
                msgVacio.classList.remove('hidden');
            } else {
                msgVacio.classList.add('hidden');
                listaA_Mostrar.forEach(prod => {
                    const badgeCombo = prod.unidades > 1 ? `<span class="absolute top-2 left-2 bg-fucsia text-white text-[10px] font-bold px-2 py-1 rounded shadow z-10">COMBO DE ${prod.unidades}</span>` : '';
                    
                    // Lógica para mostrar los precios según existan
                    let bloquePrecio = '';
                    
                    if (prod.precio > 0 && prod.precio_combo > 0 && prod.unidades > 1) {
                        // Tiene ambos precios
                        bloquePrecio = `
                            <div class="mt-auto pt-2">
                                <p class="text-xs text-gray-500 mb-0.5">Detalle: <span class="font-bold text-gray-700">$${prod.precio.toFixed(2)}</span></p>
                                <p class="text-sm text-fucsia font-bold">Combo x${prod.unidades}: $${prod.precio_combo.toFixed(2)}</p>
                            </div>
                        `;
                    } else if (prod.precio_combo > 0 && prod.precio === 0) {
                        // Solo tiene precio de combo
                        bloquePrecio = `
                            <div class="mt-auto pt-2">
                                <p class="text-sm text-fucsia font-bold">Combo x${prod.unidades}: $${prod.precio_combo.toFixed(2)}</p>
                            </div>
                        `;
                    } else {
                        // Solo tiene precio de detalle (o por defecto)
                        bloquePrecio = `
                            <div class="mt-auto pt-2">
                                <p class="text-sm text-fucsia font-bold">Detalle: $${prod.precio.toFixed(2)}</p>
                            </div>
                        `;
                    }

                    const card = `
                        <div onclick="cargarDetalle(${prod.id})" class="bg-white border rounded-xl p-3 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col h-full group relative">
                            ${badgeCombo}
                            <div class="overflow-hidden rounded-lg mb-2 border border-gray-100">
                                <img src="${prod.imgs[0]}" class="w-full h-40 object-cover group-hover:scale-105 transition duration-300">
                            </div>
                            <h3 class="font-bold text-sm text-gray-800 leading-tight">${prod.nombre}</h3>
                            ${bloquePrecio}
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            }
        }

        function filtrarCatalogo() {
            const textoBuscado = document.getElementById('buscador').value.toLowerCase();
            const productosFiltrados = productosBase.filter(prod => prod.nombre.toLowerCase().includes(textoBuscado));
            renderizarCatalogo(productosFiltrados);
        }

    function cargarDetalle(idProducto) {
    productoActivo = productosBase.find(p => p.id === idProducto);
    imgIndexActual = 0;
    const panel = document.getElementById('panel-detalle');
    const contenido = document.getElementById('contenido-detalle');
    
    panel.classList.remove('hidden');
    setTimeout(() => panel.classList.remove('translate-y-full'), 10);

    let controlesCarrusel = productoActivo.imgs.length > 1 ? `
        <button type="button" onclick="cambiarImagen(-1)" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/90 rounded-full p-2.5 shadow-lg z-20 hover:scale-105 active:scale-95 transition cursor-pointer"><svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
        <button type="button" onclick="cambiarImagen(1)" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/90 rounded-full p-2.5 shadow-lg z-20 hover:scale-105 active:scale-95 transition cursor-pointer"><svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
        <div class="absolute bottom-3 right-3 bg-black/70 text-white text-xs font-bold px-3 py-1.5 rounded-full z-20 shadow-md"><span id="img-counter">1 / ${productoActivo.imgs.length}</span></div>
    ` : '';

    let selectorCompra = '';
    let precioInicial = 0;

    // Caso 1: Tiene AMBOS precios (Muestra el selector)
    if (productoActivo.precio > 0 && productoActivo.precio_combo > 0 && productoActivo.unidades > 1) {
        precioInicial = productoActivo.precio;
        selectorCompra = `
            <div class="mb-3 bg-pink-50 p-3 rounded-lg border border-pink-100">
                <label class="font-bold text-sm text-pink-900 block mb-1">Elige cómo comprar:</label>
                <select id="tipo-compra" onchange="generarFilas()" class="w-full border-pink-200 rounded p-2 text-sm bg-white font-bold text-gray-800 outline-none focus:ring-2 focus:ring-pink-500 shadow-sm">
                    <option value="unidad">1 Unidad - $${productoActivo.precio.toFixed(2)}</option>
                    <option value="combo">Combo de ${productoActivo.unidades} piezas - $${productoActivo.precio_combo.toFixed(2)}</option>
                </select>
            </div>
        `;
    } 
    // Caso 2: SOLO tiene precio de COMBO (Venta exclusiva en combo)
    else if (productoActivo.precio_combo > 0 && productoActivo.precio === 0) {
        precioInicial = productoActivo.precio_combo;
        selectorCompra = `
            <input type="hidden" id="tipo-compra" value="combo">
            <div class="mb-3 bg-pink-50 p-2 text-center rounded-lg border border-pink-200 text-pink-800 font-bold text-sm shadow-sm">
                Venta exclusiva en Combo (${productoActivo.unidades} piezas)
            </div>
        `;
    } 
    // Caso 3: SOLO tiene precio de UNIDAD
    else {
        precioInicial = productoActivo.precio;
        selectorCompra = `<input type="hidden" id="tipo-compra" value="unidad">`;
    }

    contenido.innerHTML = `
        <div class="relative w-full h-72 bg-gray-100 rounded-lg mb-4 overflow-hidden border border-gray-200">
            <img id="img-detalle" src="${productoActivo.imgs[0]}" class="w-full h-full object-cover">
            ${controlesCarrusel}
        </div>
        <h2 class="text-2xl font-bold text-gray-800">${productoActivo.nombre}</h2>
        <p id="precio-display" class="text-xl text-fucsia font-bold mb-2">$${precioInicial.toFixed(2)}</p>
        <p class="text-gray-600 text-sm mb-4">${productoActivo.descripcion}</p>
        <hr class="mb-4">
        ${selectorCompra}
        <div class="mb-2 flex items-center justify-between">
            <label class="font-bold text-sm text-gray-700">Cantidad (Paquetes):</label>
            <input type="number" id="cant-detalle" value="1" min="1" oninput="generarFilas()" class="border rounded-lg w-16 text-center p-1.5 text-sm bg-gray-50 font-bold outline-none focus:ring-2 focus:ring-pink-500">
        </div>
        <div id="variantes-detalle" class="flex flex-col mb-4 max-h-48 overflow-y-auto scroll-variantes pr-1"></div>
        <button onclick="agregarAlCarrito()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg shadow hover:bg-black transition mt-auto">AÑADIR AL PEDIDO</button>
    `;
    generarFilas();
}

function generarFilas() {
    let cantidad = parseInt(document.getElementById('cant-detalle').value);
    if (isNaN(cantidad) || cantidad < 1) cantidad = 1;

    const selector = document.getElementById('tipo-compra');
    let tipo = selector ? selector.value : 'unidad';
    let unids = (tipo === 'combo') ? productoActivo.unidades : 1;

    // Solo actualiza el precio en pantalla si el usuario está usando el menú desplegable (Caso 1)
    if(selector && selector.tagName === 'SELECT') {
        let precioVisual = tipo === 'combo' ? productoActivo.precio_combo : productoActivo.precio;
        document.getElementById('precio-display').innerText = '$' + precioVisual.toFixed(2);
    }

    const contenedor = document.getElementById('variantes-detalle');
    let opcionesColor = productoActivo.colores.map(c => `<option value="${c}">${c}</option>`).join('');
    let opcionesTalla = productoActivo.tallas.map(t => `<option value="${t}">${t}</option>`).join('');
    contenedor.innerHTML = ''; 
    
    for (let c = 1; c <= cantidad; c++) {
        if (unids > 1) contenedor.innerHTML += `<div class="text-[11px] font-bold text-pink-600 mt-2 mb-1 uppercase tracking-wide">Configurando Combo #${c}</div>`;
        for (let u = 1; u <= unids; u++) {
            contenedor.innerHTML += `
                <div class="flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-200 mb-1.5">
                    <span class="text-xs font-bold text-gray-400 w-4">${unids > 1 ? u : c}</span>
                    <select id="color-act-${c}-${u}" class="flex-1 text-sm p-1.5 border rounded bg-white outline-none"><option value="" disabled selected>Color...</option>${opcionesColor}</select>
                    <select id="talla-act-${c}-${u}" class="flex-1 text-sm p-1.5 border rounded bg-white outline-none"><option value="" disabled selected>Talla...</option>${opcionesTalla}</select>
                </div>
            `;
        }
    }
}

function agregarAlCarrito() {
    let cantidad = parseInt(document.getElementById('cant-detalle').value);
    const selector = document.getElementById('tipo-compra');
    let tipo = selector ? selector.value : 'unidad';
    let unids = (tipo === 'combo') ? productoActivo.unidades : 1;
    let precioFinal = tipo === 'combo' ? productoActivo.precio_combo : productoActivo.precio;

    for (let c = 1; c <= cantidad; c++) {
        for (let u = 1; u <= unids; u++) {
            if(!document.getElementById(`color-act-${c}-${u}`).value || !document.getElementById(`talla-act-${c}-${u}`).value) {
                return alert(`Por favor, selecciona el Color y la Talla para todas las piezas.`);
            }
        }
    }

    for (let c = 1; c <= cantidad; c++) {
        let selecciones = [];
        for (let u = 1; u <= unids; u++) {
            selecciones.push({
                color: document.getElementById(`color-act-${c}-${u}`).value,
                talla: document.getElementById(`talla-act-${c}-${u}`).value
            });
        }
        carrito.push({ ...productoActivo, precio: precioFinal, selecciones: selecciones, tipoCompra: tipo });
    }
    
    document.getElementById('cant-detalle').value = 1;
    generarFilas();
    actualizarCarrito();
    if(window.innerWidth < 768) cerrarDetalle();
    toggleCarrito(true);
}

function enviarWhatsApp() {
    if(carrito.length === 0) return alert("El carrito está vacío.");
    
    const urlParams = new URLSearchParams(window.location.search);
    const asesorLink = urlParams.get('asesor');
    const numeroPorDefecto = "584126530612"; // Reemplaza por el principal
    const telefonoDestino = asesorLink ? asesorLink : numeroPorDefecto;

    const codigoOrden = "CS-" + Math.random().toString(36).substr(2, 6).toUpperCase();
    
    let mensaje = `*NUEVO PEDIDO - CONFECCIONES SALOMÉ*%0A`;
    mensaje += `*CÓDIGO DE ORDEN:* ${codigoOrden}%0A%0A`;
    mensaje += `*Detalle de la compra:*%0A`;
    
    carrito.forEach((item, idx) => { 
        let etiqueta = item.tipoCompra === 'combo' ? `(Combo)` : `(Unidad)`;
        mensaje += `*${idx + 1}. ${item.nombre} ${etiqueta}* ($${item.precio})%0A`; 
        item.selecciones.forEach((sel, i) => {
            mensaje += `   - Pieza ${i+1}: ${sel.color} / Talla ${sel.talla}%0A`;
        });
        mensaje += `%0A`;
    });
    
    mensaje += `*TOTAL: $${document.getElementById('total-precio').innerText}*%0A%0AConfirmo mi pedido.`;
    
    window.open(`https://wa.me/${telefonoDestino}?text=${mensaje}`, '_blank');
}

function toggleCarrito(forzarAbrir = false) {
    const panel = document.getElementById('carrito-panel');
    if (forzarAbrir === true) {
        panel.classList.remove('translate-x-full');
    } else {
        panel.classList.toggle('translate-x-full');
    }
}

function actualizarCarrito() {
    const lista = document.getElementById('lista-carrito');
    const contador = document.getElementById('contador-carrito');
    const total = document.getElementById('total-precio');

    lista.innerHTML = '';
    let sumaTotal = 0;

    if (carrito.length === 0) {
        lista.innerHTML = '<p class="text-gray-500 text-center py-10 font-medium">Tu carrito está vacío</p>';
    } else {
        carrito.forEach((item, index) => {
            sumaTotal += item.precio;
            
            let detalles = item.selecciones.map((s, i) => `<div class="text-xs text-gray-500">Pz ${i+1}: ${s.color} / ${s.talla}</div>`).join('');
            let etiqueta = item.tipoCompra === 'combo' ? `<span class="bg-fucsia text-white text-[10px] px-1 rounded ml-1 font-bold">Combo</span>` : '';

            lista.innerHTML += `
                <div class="flex items-center gap-3 bg-white p-2 rounded-lg shadow-sm border border-gray-100">
                    <img src="${item.imgs[0]}" class="w-16 h-16 object-cover rounded">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm text-gray-800 leading-tight mb-1">${item.nombre} ${etiqueta}</h4>
                        ${detalles}
                        <div class="font-bold text-fucsia text-sm mt-1">$${item.precio.toFixed(2)}</div>
                    </div>
                    <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-600 font-bold p-2 text-2xl transition">&times;</button>
                </div>
            `;
        });
    }

    contador.innerText = carrito.length;
    total.innerText = sumaTotal.toFixed(2);
}

function eliminarDelCarrito(index) {
    carrito.splice(index, 1);
    actualizarCarrito();
}

function cerrarDetalle() {
    const panel = document.getElementById('panel-detalle');
    panel.classList.add('translate-y-full'); 
    
    setTimeout(() => {
        panel.classList.add('hidden');
        document.getElementById('contenido-detalle').innerHTML = `
            <div class="text-center text-gray-400 py-20 hidden md:flex flex-col items-center">
                <img src="logo.png" class="h-24 mb-5 opacity-40 rounded-xl grayscale transition hover:grayscale-0 duration-300">
                <p class="font-medium">Selecciona un producto del catálogo.</p>
            </div>
        `;
    }, 300);
}

function cambiarImagen(direccion) {
    if (!productoActivo || productoActivo.imgs.length <= 1) return;
    imgIndexActual += direccion;
    
    if (imgIndexActual >= productoActivo.imgs.length) imgIndexActual = 0;
    if (imgIndexActual < 0) imgIndexActual = productoActivo.imgs.length - 1;
    
    document.getElementById('img-detalle').src = productoActivo.imgs[imgIndexActual];
    const counter = document.getElementById('img-counter');
    if(counter) counter.innerText = `${imgIndexActual + 1} /${productoActivo.imgs.length}`;
}

        async function cargarCatalogoDesdeAPI() {
            try {
                const respuesta = await fetch("/api/productos");                productosBase = await respuesta.json();
                renderizarCatalogo();
            } catch (error) {
                console.error("Error al conectar con la API:", error);
            }
        }

        cargarCatalogoDesdeAPI();
    </script>
</body>
</html>
